name: release

# 触发：推送 v* 标签自动发布；或手动 workflow_dispatch
# 凭据：仓库 Settings → Secrets 配置 OSS_*（OSS_ACCESS_KEY_ID /
# OSS_SECRET_ACCESS_KEY / OSS_BUCKET / OSS_ENDPOINT / OSS_REGION /
# OSS_PUBLIC_BASE / OSS_RELEASE_PREFIX / OSS_SITE_PREFIX）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 用于创建 GitHub Release 备份

jobs:
  release:
    runs-on: windows-latest   # 打包 Windows 安装包；扩展全平台时改 matrix
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_SECRET_ACCESS_KEY: ${{ secrets.OSS_SECRET_ACCESS_KEY }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_REGION: ${{ secrets.OSS_REGION }}
      OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
      OSS_RELEASE_PREFIX: ${{ secrets.OSS_RELEASE_PREFIX }}
      OSS_SITE_PREFIX: ${{ secrets.OSS_SITE_PREFIX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & package (electron-builder)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers to 天翼云 ZOS
        run: npm run upload:oss

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Upload site to 天翼云 ZOS
        run: npm run upload:site

      - name: Create GitHub Release (backup)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}