# ============================================================
# Nginx 反代配置（容器内，与 docker-compose.yml 挂载使用）
# ------------------------------------------------------------
# 上游：compose 中 server 服务名解析为容器 IP
# 监听：80（compose 已映射到主机 80）
# 服务器信息：公网 8.219.219.110
# 场景：测试环境
# ============================================================
upstream juese_backend {
    server server:4178;
    keepalive 32;
}

server {
    listen 80;
    # 测试环境仅用 IP 访问；后续有域名可改 server_name
    server_name 8.219.219.110 default_server;

    access_log /var/log/nginx/juese.access.log;
    error_log  /var/log/nginx/juese.error.log;

    client_max_body_size 100m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API
    location /api/ {
        proxy_pass http://juese_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 管理后台 SPA（由后端 Express 在 /admin 托管）
    location /admin {
        proxy_pass http://juese_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 根路径 -> /admin
    location = / {
        proxy_pass http://juese_backend;
    }

    # 健康检查
    location = /api/health {
        access_log off;
        proxy_pass http://juese_backend;
    }

    # 安装包分发：electron-updater 拉取 latest.yml + 安装包
    # 文件放在 deploy/releases/ 目录（compose 已挂载到 nginx 容器）
    location /releases/ {
        alias /usr/share/nginx/releases/;
        autoindex on;
        access_log off;
        expires 5m;
    }
}
