# ============================================================
# Nginx 反代配置（容器内，与 docker-compose.yml 挂载使用）
# ------------------------------------------------------------
# 上游：compose 中 server 服务名解析为容器 IP
# 监听：90（compose 已映射到主机 90；80/443/8080 需 ICP 备案，暂用 90）
# 服务器信息：公网 1.194.28.136（Ubuntu Server 26.04）
# 域名：jueseai.com（未 ICP 备案，暂用 IP；备案后把 server_name 改为 jueseai.com）
# 场景：测试环境
# ============================================================
upstream juese_backend {
    server server:4178;
    keepalive 32;
}

server {
    # default_server 必须在 listen 上，不能放在 server_name 上
    listen 90 default_server;
    # TODO(jueseai.com 备案后)：server_name jueseai.com www.jueseai.com;
    server_name 1.194.28.136;

    access_log /var/log/nginx/juese.access.log;
    error_log  /var/log/nginx/juese.error.log;

    client_max_body_size 100m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API
    location /api/ {
        proxy_pass http://juese_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 管理后台 SPA（由后端 Express 在 /admin 托管）
    location /admin {
        proxy_pass http://juese_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 根路径 -> /admin
    location = / {
        proxy_pass http://juese_backend;
    }

    # 健康检查
    location = /api/health {
        access_log off;
        proxy_pass http://juese_backend;
    }

    # 分发下载已走天翼云 OSS（bucket-5620/release/），nginx 不再托管 releases 路径
    # electron-updater 直接从 https://bucket-5620.zhengzhou5.zos.ctyun.cn/release/ 拉取

    # VitePress 文档站：构建产物已 COPY 进镜像 /usr/share/nginx/docs
    # 用 root 而非 alias：VitePress cleanUrls:true 生成扁平 .html（download.html），
    # 刷新 /docs/download 时需 try_files 匹配到 download.html；
    # alias + try_files 在 nginx 中有路径解析兼容问题，root 更可靠。
    location /docs/ {
        root /usr/share/nginx;
        index index.html;
        # VitePress cleanUrls:true 生成扁平 .html（如 download.html），
        # 需先尝试 $uri.html；目录页（如 api/）走 $uri/ + index；
        # 兜底回退到首页 SPA。
        try_files $uri $uri.html $uri/ /docs/index.html;
        autoindex off;
        access_log off;
        expires 5m;
    }
    # /docs 无尾斜杠时 301 到 /docs/
    location = /docs {
        return 301 /docs/;
    }

    # 兜底：所有未匹配的路径（如 /site、/data-set-rule 等）反代到后端
    location / {
        proxy_pass http://juese_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
